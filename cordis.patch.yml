# deepseek-harness-tui bundle: an interactive terminal chat directly over
# dsh-base. Like dsh-headless it mounts no Host, HTTP server, or browser
# plugin; the tui-* rows create one Agent and own the terminal until exit.
# Each row is a workspace package under packages/; the root package.json lists
# them as dependencies so the loader resolves them by name.

- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- insert:
    # Terminal I/O; provides tuiConsole.
    - id: tui-console
      name: '@dsh-tui/console'

    # Agent lifecycle and input routing; provides tuiChat.
    - id: tui-chat
      name: '@dsh-tui/chat'

    # Streamed replies, reasoning, tool calls, and turn endings.
    - id: tui-transcript
      name: '@dsh-tui/transcript'

    # Terminal answerer for approval/request and user-questions/request.
    - id: tui-interaction
      name: '@dsh-tui/interaction'

    # Slash-command registry and built-ins; provides tuiCommands.
    - id: tui-commands
      name: '@dsh-tui/commands'

    # /connect: provider keys and custom model services; registers through tuiCommands.
    - id: tui-connect
      name: '@dsh-tui/connect'

    # dsh-base omits ask_user_question; tui-interaction answers it in a panel.
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

# A configuration reload would remount the TUI rows mid-conversation.
- id: hmr
  disabled: true
